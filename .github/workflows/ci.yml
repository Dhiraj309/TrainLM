
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    name: pytest (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core-minimum
            python-version: "3.10"
            constraints: constraints/core-minimum.txt
          - profile: core-current
            python-version: "3.13"
            constraints: constraints/core-current.txt

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            constraints/*.txt

      - name: Set up Python & install dependencies
        run: |
          uv venv --seed --python "${{ matrix.python-version }}" .venv
          uv pip install --python .venv/bin/python \
            -e ".[dev]" pytest-xdist \
            -c "${{ matrix.constraints }}" \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match

      - name: Run tests
        run: .venv/bin/python -m pytest -n auto -q
