
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    name: pytest (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core-minimum
            python-version: "3.10"
            constraints: constraints/core-minimum.txt
          - profile: core-current
            python-version: "3.13"
            constraints: constraints/core-current.txt

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c "${{ matrix.constraints }}"

      - name: Run tests
        run: python -m pytest -v
