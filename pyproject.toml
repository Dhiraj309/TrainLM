[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aipm"
version = "0.1.0"
description = "AI Package Manager: capability runtime and registry for LLM systems"
authors = [
    { name = "AIPM Team" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0"
]

[project.scripts]
aipm = "aipm.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
