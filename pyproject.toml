[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trainlm"
version = "0.1.0"
description = "Minimal JAX/Flax NNX LLM pretraining framework"
authors = [
    { name = "Dhiraj Patil" }
]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "jax>=0.7.2",
    "flax>=0.11.2",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.12.0",
    "numpy",
    "pyyaml",
    "datasets",
    "transformers",
    "tokenizers",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = [
    "test_*.py",
]