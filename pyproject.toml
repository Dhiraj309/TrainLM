[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trainlm"
version = "0.1.0"
description = "A research-oriented, production-quality Large Language Model training framework built with PyTorch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

authors = [
    { name = "TrainLM Contributors" }
]

keywords = [
    "machine-learning",
    "deep-learning",
    "llm",
    "transformers",
    "pytorch",
    "training",
    "nlp"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "huggingface-hub>=1.0,<2",
    "torch>=2.9,<2.14",
    "transformers>=5.0,<6",
]

[project.optional-dependencies]
tpu-xla = [
    "torch==2.9.0",
    "torch-xla[tpu]==2.9.0",
    "transformers==5.15.0",
]
tpu-pallas = [
    "torch==2.9.0",
    "torch-xla[pallas,tpu]==2.9.0",
    "transformers==5.15.0",
]
profiling = [
    "tensorboard>=2.18,<3",
]
dev = [
    "jsonschema>=4.23,<5",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "tomli>=2.2,<3; python_version < '3.11'",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
