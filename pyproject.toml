[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trainlm"
version = "0.1.0"
description = "Config-driven LLM training system using JAX/Flax and Hugging Face"
authors = [
    { name = "TrainLM" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # ------------------------------------------------------------
    # Core config
    # ------------------------------------------------------------
    "pyyaml>=6.0",
    "pydantic>=2.6,<2.13",

    # ------------------------------------------------------------
    # Hugging Face (Flax-compatible)
    # ------------------------------------------------------------
    "transformers>=4.40,<5",

    # ------------------------------------------------------------
    # JAX ecosystem (JAX NOT INCLUDED — install manually!)
    # ------------------------------------------------------------
    # "flax>=0.7.0,<0.8",
    # "optax>=0.1.7,<0.2",
    # "numpy>=1.24",

    # ------------------------------------------------------------
    # Utilities
    # ------------------------------------------------------------
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "black>=24.0",
    "ruff>=0.3.0",
]

# NOTE:
# ------------------------------------------------------------
# JAX / TPU / GPU INSTALLATION (IMPORTANT)
# ------------------------------------------------------------
# JAX is NOT included because it depends on hardware.
#
# Install AFTER installing this package:
#
# TPU (Colab / Kaggle TPU):
#   pip install -U "jax[tpu]" \
#     -f https://storage.googleapis.com/jax-releases/libtpu_releases.html
#
# GPU (CUDA 12 example):
#   pip install "jax[cuda12]"
#
# CPU:
#   pip install jax
#
# ------------------------------------------------------------

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]